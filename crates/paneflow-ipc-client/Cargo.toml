[package]
name = "paneflow-ipc-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Blocking JSON-RPC client for Paneflow's local IPC socket (shared by the MCP bridge and the CLI)"

[dependencies]
interprocess.workspace = true
serde_json.workspace = true

# Windows 命名管道不支持套接字式超时；客户端直接使用可取消的重叠 I/O，
# 既保留请求截止时间，也避开 interprocess 在 PIPE_NOWAIT 下的 fast-fail 路径。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
